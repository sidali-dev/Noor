name: noor
description: "Faith: prayer times and adhan, Quran, adhkar and qibla."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  iconsax: ^0.0.8
  get: ^4.6.5
  intl: ^0.20.2
  flutter_native_splash: ^2.4.0
  flutter_svg: ^2.0.10+1
  flutter_localizations:
        sdk: flutter
  shared_preferences: ^2.2.3
  csc_picker_plus: ^0.0.3
  http: ^1.2.0
  workmanager: ^0.10.10
  alarm: ^5.15.0
  permission_handler: ^11.3.1
  audioplayers: ^6.0.0
  flutter_qiblah: ^3.2.0
  geolocator: ^14.0.2
  geocoding: ^3.0.0
  quran: ^1.3.0
  carousel_slider: ^5.1.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_icon.png"
  image_path_ios: "assets/logo/app_icon_ios.png"
  adaptive_icon_background: "#eef0f4"
  adaptive_icon_foreground: "assets/logo/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:

  uses-material-design: true

  #------------- LOCAL ASSETS -------------#
  assets:
    - assets/images/svg/
    - assets/images/art/
    - assets/images/ornaments/
    - assets/logo/faith-mark-paper.png
    - assets/logo/faith-mark-night.png
    - assets/sounds/
    - assets/data/adhkar.json

  #------------- LOCAL FONTS -------------#
  fonts:
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/cormorant/CormorantGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/cormorant/CormorantGaramond-SemiBold.ttf
          weight: 600

    - family: Jost
      fonts:
        - asset: assets/fonts/jost/Jost-Regular.ttf
          weight: 400
        - asset: assets/fonts/jost/Jost-Medium.ttf
          weight: 500

    - family: Amiri
      fonts:
        - asset: assets/fonts/amiri/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/amiri/Amiri-Bold.ttf
          weight: 700

    - family: Quran
      fonts:
        - asset: assets/fonts/quran_font/Quran-Medium.ttf

flutter_intl:
  enabled: true
