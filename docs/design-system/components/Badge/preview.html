<html>
<head><meta charset="utf-8"><title>Badge — preview</title></head>
<body>
<div id="root" class="hl-row"></div>
<script>
  var H = window.Hilal, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(H.Badge, null, 'Hanafi'),
    h(H.Badge, { tone: 'night', icon: 'moon' }, 'Tonight'),
    h(H.Badge, { tone: 'brass', icon: 'star' }, 'Eid'),
    h(H.Badge, { tone: 'success' }, 'Prayed'),
    h(H.Badge, { tone: 'danger' }, 'Missed')
  ));
</script>
</body>
