<!doctype html>
<html data-theme="paper">
<head>
<meta charset="utf-8"><title>Hilal — demo</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components/bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="components/bundle.js"></script>
</head>
<body>
<div id="root" class="hl-stack" style="max-width:420px;margin:0 auto"></div>
<script>
  var H = window.Hilal, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('img', { src: 'assets/Logos/faith-mark-paper.svg', width: 72, style: { margin: '0 auto' }, alt: 'Faith' }),
    h(H.ArchFrame, { width: 320, contentTop: '29%' },
      h('p', { className: 'eyebrow', style: { color: 'var(--on-window-muted)', margin: 0 } }, '10 DHUL HIJJAH'),
      h('h2', { className: 'display-lg', style: { color: 'var(--on-window)', margin: 0, fontSize: '34px', lineHeight: '38px' } }, 'Eid Mubarak')),
    h(H.PaperCard, { eyebrow: 'Next prayer', title: 'Maghrib 18:42' }, 'In 1 h 20 min'),
    h(H.Button, { icon: 'bell' }, 'Set reminder'),
    h(H.Button, { variant: 'secondary', onClick: function () { var e = document.documentElement; e.dataset.theme = e.dataset.theme === 'night' ? 'paper' : 'night'; } }, 'Switch theme'),
    h(H.TabBar, { items: [{ id: 't', label: 'Today', icon: 'home' }, { id: 'q', label: 'Qibla', icon: 'compass' }, { id: 'c', label: 'Calendar', icon: 'calendar' }] })
  ));
</script>
</body>
</html>
